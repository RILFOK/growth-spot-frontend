<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Фон с градиентом -->
  <rect width="1200" height="630" fill="url(#bg-gradient)"/>
  
  <!-- Декоративные круги -->
  <circle cx="100" cy="100" r="200" fill="url(#circle-gradient)" opacity="0.3"/>
  <circle cx="1100" cy="530" r="250" fill="url(#circle-gradient)" opacity="0.2"/>
  <circle cx="900" cy="100" r="150" fill="#6366F1" opacity="0.1"/>
  
  <!-- Сетка -->
  <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
    <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>
  
  <!-- Логотип молния -->
  <g transform="translate(100, 215)">
    <path 
      fill="url(#logo-gradient)" 
      d="M25.946 44.938c-.664.845-2.021.375-2.021-.698V33.937a2.26 2.26 0 0 0-2.262-2.262H10.287c-.92 0-1.456-1.04-.92-1.788l7.48-10.471c1.07-1.497 0-3.578-1.842-3.578H1.237c-.92 0-1.456-1.04-.92-1.788L10.013.474c.214-.297.556-.474.92-.474h28.894c.92 0 1.456 1.04.92 1.788l-7.48 10.471c-1.07 1.498 0 3.579 1.842 3.579h11.377c.943 0 1.473 1.088.89 1.83L25.947 44.94z"
      transform="scale(4.5)"
    />
  </g>
  
  <!-- Текст -->
  <text x="340" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="800" fill="white">
    Точка Роста
  </text>
  <text x="340" y="360" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="500" fill="rgba(255,255,255,0.8)">
    Веб-разработка для бизнеса
  </text>
  
  <!-- Подзаголовок -->
  <text x="340" y="440" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="rgba(255,255,255,0.6)">
    Сайты под ключ • Запуск • Поддержка
  </text>
  
  <!-- Контакт -->
  <rect x="340" y="480" width="300" height="50" rx="25" fill="rgba(255,255,255,0.1)"/>
  <text x="370" y="513" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="white">
    growth-spot.ru
  </text>
  
  <!-- Градиенты -->
  <defs>
    <linearGradient id="bg-gradient" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="circle-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="logo-gradient" x1="0" y1="0" x2="48" y2="46" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
  </defs>
</svg>
